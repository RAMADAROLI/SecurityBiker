name: Build Security Biker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Crear buildozer.spec
        run: |
          cat > buildozer.spec <<'EOF'
          [app]

          title = Security Biker
          package.name = securitybiker
          package.domain = org.securitybiker

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas

          version = 1.0

          requirements = python3,kivy==2.3.0,plyer==2.1.0

          orientation = portrait

          fullscreen = 0

          android.permissions = ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,CALL_PHONE

          [buildozer]

          log_level = 2
          warn_on_root = 1
          EOF

      - name: Construir APK
        run: |
          buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Security-Biker-APK
          path: bin/*.apk
