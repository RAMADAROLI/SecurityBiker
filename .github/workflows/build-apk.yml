name: Build Security Biker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Configurar Buildozer
        run: |
          sed -i 's/^title = .*/title = Security Biker/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = securitybiker/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.securitybiker/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.0,plyer==2.1.0/' buildozer.spec
          sed -i 's/^# *android.permissions = .*/android.permissions = android.permission.ACCESS_FINE_LOCATION,android.permission.ACCESS_COARSE_LOCATION,android.permission.CALL_PHONE/' buildozer.spec
      - name: Usar Android SDK de GitHub
        run: |
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDAPI=35" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=23" >> $GITHUB_ENV
          rm -rf ~/.buildozer/android/platform/android-sdk
          rm -rf ~/.buildozer/android/platform/android-ndk-r28c

      - name: Crear APK
        run: |
          buildozer -v android debug
      - name: Crear APK
        run: |
          buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Security-Biker-APK
          path: bin/*.apk
