name: Crear APK Security Biker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Compilar aplicación con Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SecurityBiker-APK
          path: ${{ steps.buildozer.outputs.filename }}
